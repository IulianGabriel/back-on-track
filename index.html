<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Back on Track</title>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0e10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="On Track">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Shown while we find out if you're signed in -->
  <div id="loading" class="screen center">
    <div class="spinner" aria-label="Loading"></div>
  </div>

  <!-- Sign-in screen -->
  <div id="login" class="screen center" hidden>
    <img src="icons/icon-192.png" alt="" class="logo">
    <h1>Back on Track</h1>
    <p class="muted">One step at a time.</p>
    <button id="signin-btn" class="primary">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21.35 11.1H12v2.98h5.35c-.5 2.4-2.6 3.92-5.35 3.92a6 6 0 1 1 3.9-10.56l2.2-2.2A9 9 0 1 0 21 12c0-.3-.02-.6-.05-.9z"/></svg>
      Sign in with Google
    </button>
    <p id="login-error" class="error" hidden></p>
  </div>

  <!-- Main app -->
  <div id="app" class="screen with-nav" hidden>

    <!-- ===== Tasks tab ===== -->
    <div id="tab-tasks">
      <header class="topbar">
        <div class="headline">
          <div id="today-label" class="today"></div>
          <div id="progress-label" class="muted small"></div>
        </div>
        <button id="edit-btn" class="pill">Edit</button>
      </header>
      <div class="progress"><div id="progress-bar"></div></div>

      <section class="card" data-section="daily">
        <div class="card-head">
          <h2>Daily</h2>
          <span class="count muted small"></span>
        </div>
        <ul class="tasks"></ul>
        <form class="add-form">
          <input type="text" placeholder="Add a daily task…" maxlength="300" enterkeyhint="done" aria-label="New daily task">
          <button type="submit" class="add-btn" aria-label="Add task">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
          </button>
        </form>
      </section>

      <section class="card" data-section="additional">
        <div class="card-head">
          <h2>Additional <span class="muted sub">weekly or longer</span></h2>
          <span class="count muted small"></span>
        </div>
        <ul class="tasks"></ul>
        <form class="add-form">
          <input type="text" placeholder="Add a weekly or monthly task…" maxlength="300" enterkeyhint="done" aria-label="New weekly or monthly task">
          <button type="submit" class="add-btn" aria-label="Add task">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
          </button>
        </form>
      </section>

      <p class="muted small note">Checkmarks reset every night at 00:00, Romanian time.</p>

      <footer class="settings">
        <div id="user-label" class="muted small"></div>
        <div class="settings-buttons">
          <button id="export-btn" class="link">Download backup</button>
          <button id="import-btn" class="link">Restore backup</button>
          <button id="signout-btn" class="link">Sign out</button>
        </div>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </footer>
    </div>

    <!-- ===== Journal tab ===== -->
    <div id="tab-journal" hidden>
      <header class="topbar">
        <div class="headline">
          <div id="journal-date" class="today">Today</div>
          <div id="journal-subtitle" class="muted small"></div>
        </div>
        <button id="journal-today-btn" class="pill" hidden>Today</button>
      </header>
      <div class="progress"></div>

      <section class="card journal-card">
        <textarea id="journal-text" rows="8" placeholder="How was today? What are you thinking about?" aria-label="Journal entry"></textarea>
        <div id="journal-status" class="journal-status"></div>
      </section>

      <div id="on-this-day" hidden></div>

      <div class="archive-head">
        <h2 class="section-title">Past entries</h2>
        <label class="goto">
          <span>Go to date</span>
          <input id="journal-goto" type="date" aria-label="Go to a date">
        </label>
      </div>
      <div id="journal-list"></div>
    </div>

    <!-- ===== Bottom navigation ===== -->
    <nav class="bottom-nav" aria-label="Sections">
      <button class="nav-btn active" data-tab="tasks">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Tasks</span>
      </button>
      <button class="nav-btn" data-tab="journal">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5m0-15v15m0 0A1.5 1.5 0 0 0 6.5 21H19M9 7h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Journal</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
